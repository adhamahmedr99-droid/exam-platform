<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة الامتحانات</title>
<style>
:root{--navy:#12233f;--navy2:#1d3459;--teal:#0f8b8d;--tealsoft:#e2f3f3;--gray:#f3f5f7;--ink:#1a2433;--ink2:#5c6675;--hair:#e3e7ec;--red:#b3261e;}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--gray);color:var(--ink);line-height:1.7}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 1px 3px rgba(18,35,63,.07)}
.btn{display:inline-block;border:none;border-radius:12px;padding:11px 20px;font:inherit;font-size:15px;cursor:pointer;text-decoration:none;text-align:center}
.btn-p{background:var(--navy);color:#fff}
.btn-s{background:#fff;color:var(--navy);border:1px solid var(--hair)}
.btn-g{background:none;color:var(--ink2)}
.btn-t{background:var(--teal);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
.btn-sm{padding:7px 13px;font-size:13px;border-radius:10px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=datetime-local],textarea,select{width:100%;border:1px solid var(--hair);border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;background:#fff;color:var(--ink);margin-top:4px}
textarea{min-height:88px;resize:vertical}
label{font-size:13px;color:var(--ink2);display:block;margin-top:12px}
.chip{display:inline-block;font-size:11px;padding:4px 10px;border-radius:999px;margin-inline-start:6px}
.c-new{background:var(--gray);color:var(--ink2)}.c-done{background:var(--tealsoft);color:var(--teal)}.c-dup{background:#fbe9e7;color:var(--red)}.c-prog{background:#fff4d6;color:#8a6100}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0}
.scard{background:var(--gray);border-radius:14px;padding:13px}
.scard b{display:block;font-size:23px;color:var(--navy)}
.scard span{font-size:12px;color:var(--ink2)}
.topbar{background:var(--navy);color:#fff;border-radius:16px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0}
.topbar .t1{font-size:17px;font-weight:700}
.topbar .t2{font-size:12px;opacity:.8}
.timer{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.13);border-radius:12px;padding:3px 13px}
.timer.low{background:var(--red);animation:blink 1s step-start infinite}
@keyframes blink{50%{opacity:.7}}
.qnav{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.qnav button{width:36px;height:36px;border-radius:10px;border:1px solid var(--hair);background:#fff;color:var(--ink2);font:inherit;font-size:13px;cursor:pointer}
.qnav button.done{background:var(--tealsoft);border-color:var(--teal);color:var(--teal);font-weight:700}
.qnav button.cur{outline:2px solid var(--navy)}
.choice{display:block;width:100%;text-align:start;padding:13px 15px;border:1px solid var(--hair);border-radius:14px;background:#fff;color:var(--ink);font:inherit;font-size:15px;margin-top:8px;cursor:pointer}
.choice.sel{border-color:var(--teal);background:var(--tealsoft);color:var(--teal);font-weight:600}
.shell{display:block}
.side{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--hair);margin-bottom:14px;padding-bottom:8px}
.side a{white-space:nowrap;padding:8px 12px;border-radius:10px;color:var(--ink2);text-decoration:none;font-size:14px}
.side a.on{background:var(--navy);color:#fff}
@media(min-width:900px){.shell{display:grid;grid-template-columns:200px 1fr;gap:24px}.side{flex-direction:column;border:none;position:sticky;top:10px}}
.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--hair);align-items:center;flex-wrap:wrap}
.row:first-child{border-top:none}
.row .nm{font-weight:600}
.row .dt{font-size:12px;color:var(--ink2)}
.row .vl{font-weight:700;color:var(--navy)}
.note{background:var(--gray);border-radius:12px;padding:12px;font-size:13px;color:var(--ink2);margin:10px 0}
.warn{background:#fff8ec;border-radius:12px;padding:12px;font-size:13px;color:#7a5a00;margin:10px 0}
.err{background:#fbe9e7;border-radius:12px;padding:12px;font-size:13px;color:var(--red);margin:10px 0}
.msg{white-space:pre-wrap;border:1px solid var(--hair);border-radius:12px;padding:12px;font-size:13px;background:var(--gray)}
.score{text-align:center;padding:8px 0 14px}
.score b{font-size:42px;color:var(--navy)}
.score i{font-style:normal;font-size:19px;color:var(--ink2)}
.score div{color:var(--teal);font-weight:700}
.bar{height:26px;background:var(--tealsoft);border-radius:8px;position:relative;margin:6px 0}
.bar i{position:absolute;inset:0;inset-inline-end:auto;background:var(--teal);border-radius:8px;opacity:.45}
.bar span{position:absolute;inset-inline-start:8px;top:2px;font-size:12px;font-weight:700;color:var(--navy)}
.bar em{position:absolute;inset-inline-end:8px;top:2px;font-size:12px;font-style:normal;color:var(--ink2)}
.h1{font-size:24px;font-weight:800;color:var(--navy);margin:6px 0}
.h2{font-size:18px;font-weight:700;color:var(--navy);margin:16px 0 4px}
.muted{color:var(--ink2);font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.answer-key{background:var(--tealsoft);border:1px solid var(--teal);border-radius:12px;padding:12px;margin-top:10px}.answer-pick{display:flex;gap:8px;align-items:center;margin:0;font-size:14px;color:var(--navy);min-height:44px}.answer-pick input{width:22px;height:22px;accent-color:var(--teal);flex-shrink:0}.flow{display:grid;gap:8px}.flow a{text-align:start}.ltr{direction:ltr;text-align:left;font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
@media print{.side,.no-print{display:none!important}body{background:#fff}.card{box-shadow:none;border:1px solid #ddd}}
.track-counts{grid-template-columns:repeat(2,minmax(0,1fr))}.track-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.track-head strong{font-size:18px;overflow-wrap:anywhere}.track-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.track-metrics>div{background:var(--gray);border-radius:12px;padding:12px;min-width:0}.track-metrics span,.track-metrics small{display:block;font-size:12px;color:var(--ink2)}.track-metrics b{display:block;font-size:22px;color:var(--navy)}

/* Student experience: light CSS-only decoration, never over the questions. */
body.student-view{background:#f1f6fb;isolation:isolate}
body.student-view::before,body.student-view::after{content:"";position:fixed;pointer-events:none;z-index:-1;border-radius:38px;opacity:.55;animation:study-float 12s ease-in-out infinite alternate}
body.student-view::before{width:210px;height:210px;background:linear-gradient(135deg,#b8e4e1,#d9e7fb);top:70px;right:-105px;transform:rotate(25deg)}
body.student-view::after{width:140px;height:140px;border:22px solid #d2dcf6;bottom:70px;left:-85px;animation-delay:-6s}
@keyframes study-float{to{transform:translateY(18px) rotate(35deg)}}
.student-view .wrap{max-width:860px;padding-bottom:32px}
.student-view .card{border:1px solid #e1e9f1;box-shadow:0 6px 22px rgba(18,35,63,.04)}
.student-hero{position:relative;overflow:hidden;background:linear-gradient(125deg,#142b4c,#21566b);color:#fff;border-radius:24px;padding:26px 24px;margin:16px 0 22px}
.student-hero::after{content:"";position:absolute;width:130px;height:130px;border:1px solid #ffffff30;border-radius:28px;left:-38px;top:-35px;transform:rotate(24deg);pointer-events:none}
.student-hero .h1{color:#fff;font-size:28px;margin:8px 0}
.student-hero p{color:#e1eff4;margin:8px 0 0;font-size:14px;max-width:580px}
.study-tag{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;letter-spacing:.2px}
.study-tag i{width:8px;height:8px;border-radius:50%;background:#80d4c8}
.study-art{font-size:26px;display:block;margin-bottom:12px;color:#a7e3dc;letter-spacing:8px;direction:ltr;text-align:right}
.student-view .topbar{background:linear-gradient(115deg,#142b4c,#21566b);border-radius:20px}
.student-view .topbar .t1{font-size:16px;overflow-wrap:anywhere}
.student-view .timer{flex-shrink:0;direction:ltr;white-space:nowrap}
.exam-progress{background:#fff;border:1px solid #e1e9f1;border-radius:18px;padding:16px;margin:14px 0 22px}
.progress-label{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink2);margin-bottom:8px}
.progress-label b{color:var(--teal)}
.progress-track{height:6px;border-radius:20px;background:#e8eff3;overflow:hidden}
.progress-track span{display:block;height:100%;background:var(--teal);border-radius:20px;transition:width .25s ease}
.student-view .qnav{margin:14px 0 0;gap:8px}
.student-view .qnav button{min-width:40px;height:40px}
.question-card{scroll-margin-top:16px;border-top:3px solid #bdddda!important;position:relative}
.question-heading{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.question-number{display:grid;place-items:center;width:36px;height:36px;flex-shrink:0;border-radius:12px;background:#e8f3f3;color:#14777b;font-size:15px;font-weight:700}
.question-card .question-text{font-size:17px;font-weight:600;overflow-wrap:anywhere;margin:10px 0 18px}
.student-view .choice{display:flex;align-items:center;gap:10px;transition:background-color .15s,border-color .15s;min-height:50px}
.choice-dot{width:19px;height:19px;border:1.5px solid #bcc9d5;border-radius:50%;flex-shrink:0;display:grid;place-items:center}
.choice.sel .choice-dot{border:5px solid var(--teal);background:#fff}
.choice-text{overflow-wrap:anywhere;min-width:0}
.student-view :is(button,input,textarea):focus-visible{outline:3px solid #408ad1;outline-offset:3px}
.exam-finish{border:1px solid #c9dddd!important;background:linear-gradient(130deg,#fff,#eff8f6);margin-top:28px!important;text-align:center;padding:24px 18px!important}
.exam-finish .h2{margin-top:0}.exam-finish .btn{min-height:50px;width:100%;max-width:360px;margin-top:8px}
.save-status{font-size:12px;color:var(--ink2);margin-top:10px;min-height:21px}
#confirm{scroll-margin-top:16px;border:2px solid #c9dddd;animation:card-in .2s ease-out}
@keyframes card-in{from{opacity:.5;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:420px){.student-hero{padding:24px 20px}.student-hero .h1{font-size:25px}.student-view .wrap{padding:12px}.student-view .card{padding:16px}.student-view .topbar{padding:14px}.question-heading .muted{font-size:12px}}
@media(prefers-reduced-motion:reduce){.student-view::before,.student-view::after,.student-view .timer.low,#confirm{animation:none!important}.student-view *{scroll-behavior:auto!important;transition:none!important}}

<body>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://lrlwdktnlmfxhpwcnskn.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_nPTht0gtZDeKzJH1J4NpTA_Pfb-jbam';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss = s => Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
const normAr = t => String(t ?? '').replace(/[ً-ْٰ]/g,'').replace(/ـ/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim().toLowerCase();
const waLink = (phone, text) => 'https://wa.me/' + String(phone||'').replace(/\D/g,'').replace(/^0/, '20').replace(/^0020/, '20') + '?text=' + encodeURIComponent(text);
const token6 = () => { const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const r=crypto.getRandomValues(new Uint32Array(6)); return [...r].map(x=>a[x%32]).join(''); };
const newtok = () => token6() + token6(); // 12-char one-time code

function hashSeed(str){let h=2166136261>>>0;for(const ch of String(str)){h^=ch.codePointAt(0);h=Math.imul(h,16777619)>>>0}return h>>>0}
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function shuffleSeeded(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
function buildSession(qs, shq, shc, seedStr){
  const rng=mulberry32(hashSeed('EXS:'+seedStr));
  let order=qs.map((q,i)=>i); if(shq) order=shuffleSeeded(order,rng);
  return order.map(srcIdx=>{const q=qs[srcIdx];let choices=q.choices||null,correctMap=choices?choices.map((_,i)=>i):null;
    if((q.type==='mcq'||q.type==='tf')&&shc&&choices){const idx=choices.map((_,i)=>i);const sh=shuffleSeeded(idx,rng);correctMap=sh;choices=sh.map(i=>q.choices[i]);}
    return{srcIdx,...q,choices,correctMap};});
}

let studentState = null; // {sessionId, student, exam, questions, session(shuffled), answers, timerIv, endAt}

function render(html){ app.innerHTML = html; window.scrollTo(0,0); }
function on(sel, ev, fn){ app.querySelectorAll(sel).forEach(el => el.addEventListener(ev, fn)); }
const val = sel => { const el = app.querySelector(sel); return el ? el.value : ''; };

// Shared by code redeem and open-link start
function startStudentSession(data){
  const session = buildSession(data.questions, data.exam.shuffle_q, data.exam.shuffle_c, data.session_id);
  const answers = {};
  session.forEach(q => { const sv = data.saved[q.id]; answers[q.srcIdx] = sv === undefined ? null : sv; });
  const endAt = new Date(data.exam.started_at).getTime() + data.exam.duration_min * 60000;
  studentState = { sessionId: data.session_id, student: data.student, exam: data.exam, session, answers, endAt, idx: 0 };
  location.hash = '#/exam';
}

// Open link (no code): student types their name and starts
async function openLanding(token, err, info){
  document.body.classList.add('student-view');
  if (info === undefined){
    render('<div class="card"><div class="note">بنفتح الامتحان…</div></div>');
    const { data } = await sb.rpc('open_info', { p_token: token });
    if (!data || !data.ok){
      const m = { invalid_link:'اللينك ده مش صحيح أو اتلغى. اطلب من المدرس لينك جديد.',
        not_published:'الامتحان ده مش متاح حاليًا. كلم مدرسك.',
        not_yet:'الامتحان لسه مفتحش في معاده.',
        expired:'فترة الامتحان خلصت. كلم مدرسك.',
        link_off:'اللينك ده متوقف دلوقتي. اطلب من المدرس لينك شغال أو كود.' };
      return render(`<div class="card"><div class="h2">مشكلة في اللينك</div><div class="err">${esc(m[data && data.error] || 'حصلت مشكلة، جرب تاني.')}</div></div>`);
    }
    return openLanding(token, '', data);
  }
  render(`
  <header class="student-hero">
    <span class="study-art" aria-hidden="true">✦ ▤ ◇</span>
    <span class="study-tag"><i aria-hidden="true"></i>مساحتك للتركيز والإنجاز</span>
    <h1 class="h1">${esc(info.title)}</h1>
    <p>${[info.subject, info.grade].filter(Boolean).map(esc).join(' · ') || 'امتحان مفتوح من مدرسك'}</p>
  </header>
  <div class="card">
    <div class="h2" style="margin-top:0">سجّل اسمك وابدأ</div>
    <p class="muted">الامتحان ${info.duration_min} دقيقة، وبيتسلّم لوحده لما الوقت يخلص. اكتب اسمك الحقيقي عشان المدرس يعرف صاحب الحل.</p>
    <label>اسم الطالب</label>
    <input type="text" id="o-name" placeholder="مثال: أحمد محمد" autocomplete="off">
    <label>رقم واتساب ولي الأمر (اختياري)</label>
    <input type="text" id="o-phone" class="ltr" placeholder="مثال: 01012345678" autocomplete="off">
    ${err ? `<div class="err">${esc(err)}</div>` : ''}
    <div class="actions"><button class="btn btn-p" id="o-go">تسجيل وبدء الامتحان</button></div>
  </div>`);
  on('#o-go','click', async () => {
    const name = val('#o-name').trim();
    if (!name) return openLanding(token, 'اكتب اسمك الأول.', info);
    const { data, error } = await sb.rpc('open_session', { p_token: token, p_name: name, p_phone: val('#o-phone').trim() });
    if (error || !data || !data.ok){
      const m = { invalid_link:'اللينك ده مش صحيح أو اتلغى. اطلب من المدرس لينك جديد.',
        not_published:'الامتحان ده مش متاح حاليًا. كلم مدرسك.',
        not_yet:'الامتحان لسه مفتحش في معاده.',
        expired:'فترة الامتحان خلصت. كلم مدرسك.',
        link_off:'اللينك ده اتوقف. اطلب من المدرس لينك شغال أو كود.',
        name_required:'اكتب اسمك الأول.' };
      return openLanding(token, m[data && data.error] || 'حصلت مشكلة، جرب تاني.', info);
    }
    startStudentSession(data);
  });
}

// ============ STUDENT ============
function studentLanding(err){
  document.body.classList.add('student-view');
  render(`
  <header class="student-hero">
    <span class="study-art" aria-hidden="true">✦ ▤ ◇</span>
    <span class="study-tag"><i aria-hidden="true"></i>مساحتك للتركيز والإنجاز</span>
    <h1 class="h1">جاهز تبدأ؟</h1>
    <p>خد نفس، ركّز، وحلّ على مهلك. كل سؤال خطوة لقدّام.</p>
  </header>
  <div class="card">
    <div class="h2" style="margin-top:0">بوابة الامتحانات</div>
    <p class="muted">اكتب الكود اللي المدرس بعتهولك عشان تدخل امتحانك.</p>
    <label>كود الامتحان</label>
    <input type="text" id="code" class="ltr" placeholder="مثال: K7QX2MB4TP9W" autocomplete="off">
    ${err ? `<div class="err">${esc(err)}</div>` : ''}
    <div class="actions"><button class="btn btn-p" id="go">دخول</button></div>
  </div>
  <div class="card">
    <div class="h2">إزاي بتمشي الأمور؟</div>
    <ol class="muted">
      <li>المدرس يبعتلك كود خاص بيك أنت بس، بيشتغل مرة واحدة.</li>
      <li>تكتب الكود هنا، تشوف بيانات الامتحان، وتبدأ لما تكون جاهز.</li>
      <li>الامتحان بيفتح في صفحة لوحده بتايمر بيسلّم تلقائي لما الوقت يخلص.</li>
      <li>إجاباتك بتتحفظ على السيرفر أول بأول، حتى لو الصفحة اتقفلت بتكمل من مكانك.</li>
    </ol>
  </div>
  `);
  on('#go','click', async () => {
    const code = val('#code').trim().toUpperCase().replace(/\s/g,'');
    if (!code) return studentLanding('اكتب الكود الأول.');
    const { data, error } = await sb.rpc('redeem_code', { p_token: code });
    if (error || !data || !data.ok) {
      const m = { invalid_code:'الكود ده مش مظبوط. تأكد إنك كاتبه زي ما وصلك بالظبط.',
        not_published:'الامتحان ده مش متاح حاليًا. كلم مدرسك.',
        not_yet:'الامتحان لسه مفتحش في معاده.',
        expired:'فترة الامتحان خلصت. كلم مدرسك.',
        already_completed:'الكود ده اتستخدم وخلّص قبل كده. الكود بيشتغل مرة واحدة بس.' };
      return studentLanding(m[data && data.error] || 'حصلت مشكلة، جرب تاني.');
    }
    startStudentSession(data);
  });
}

function studentInfo(){
  const s = studentState;
  const totalPts = s.session.reduce((a,q)=>a+Number(q.points),0);
  const resumed = s.session.some(q=>answerPresent(s.answers[q.srcIdx]));
  render(`

// Keep each question's saves in order, including text typed just before submit.
const answerTimers = new Map();
const answerSaves = new Map();
const failedAnswers = new Map();
function answerPresent(value){return value!==null && value!==undefined && String(value).trim()!=='';}
function saveStatus(text){const el=app.querySelector('#save-status');if(el)el.textContent=text;}
function saveAnswer(qid,value){
  const sessionId=studentState.sessionId;
  const previous=answerSaves.get(qid)||Promise.resolve();
  saveStatus('جاري حفظ إجاباتك…');
  const pending=previous.catch(()=>{}).then(async()=>{
    const {data,error}=await sb.rpc('save_answer',{p_session:sessionId,p_question:qid,p_answer:value});
    if(error || (data && data.ok===false)) throw new Error('save failed');
    failedAnswers.delete(qid);
  }).catch(()=>{failedAnswers.set(qid,value);}).finally(()=>{
    if(answerSaves.get(qid)===pending)answerSaves.delete(qid);
    if(!answerSaves.size && !answerTimers.size)saveStatus(failedAnswers.size?'في إجابات لسه متحفظتش. اتأكد من اتصالك قبل التسليم.':'إجاباتك اتحفظت تلقائيًا.');
  });
  answerSaves.set(qid,pending);
  return pending;
}
function saveAnswerDebounced(qid,value){
  clearTimeout(answerTimers.get(qid)?.timer);
  const timer=setTimeout(()=>{answerTimers.delete(qid);saveAnswer(qid,value);},700);
  answerTimers.set(qid,{timer,value});
  saveStatus('جاري حفظ إجاباتك…');
}
async function flushAnswers(){
  for(const [qid,item] of answerTimers){clearTimeout(item.timer);saveAnswer(qid,item.value);}
  answerTimers.clear();
  await Promise.all([...answerSaves.values()]);
  const retry=[...failedAnswers];
  await Promise.all(retry.map(([qid,value])=>saveAnswer(qid,value)));
  return failedAnswers.size===0;
}
function refreshProgress(){
  const s=studentState;
  const count=s.session.filter(q=>answerPresent(s.answers[q.srcIdx])).length;
  app.querySelectorAll('[data-nav]').forEach(button=>{
    const q=s.session[+button.dataset.nav];
    button.classList.toggle('done',answerPresent(s.answers[q.srcIdx]));
  });
  const label=app.querySelector('#answered-count');if(label)label.textContent=count+' من '+s.session.length;
  const bar=app.querySelector('#progress-fill');if(bar)bar.style.width=(count*100/s.session.length)+'%';
  const summary=app.querySelector('#finish-summary');if(summary)summary.textContent=count===s.session.length?'جاوبت على كل الأسئلة. راجع إجاباتك قبل التسليم.':'جاوبت على '+count+' من '+s.session.length+' سؤال. راجع الأسئلة اللي لسه من غير إجابة.';
  app.querySelector('#confirm')?.remove();
}
function scrollQuestion(index){
  const card=app.querySelector('#question-'+index);
  card?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
  card?.focus({preventScroll:true});
}

function startTick(){
  clearInterval(studentState.timerIv);
  studentState.timerIv = setInterval(() => {
    const s = studentState;
    if (!s) return clearInterval(studentState.timerIv);
    const left = Math.round((s.endAt - Date.now())/1000);
    const t = app.querySelector('#timer');
    if (t){ t.textContent = mmss(Math.max(0,left)); if (left<=60) t.classList.add('low'); }
    if (left <= 0){ clearInterval(s.timerIv); doSubmit(true); }
  }, 1000);
}

function confirmSubmit(){
  const s=studentState;
  if(s.submitting)return;
  app.querySelector('#confirm')?.remove();
  const missing=s.session.map((q,i)=>answerPresent(s.answers[q.srcIdx])?null:i).filter(i=>i!==null);
  const card=document.createElement('section');
  card.className='card';card.id='confirm';card.setAttribute('aria-labelledby','confirm-title');
  card.innerHTML=`<h2 class="h2" id="confirm-title" tabindex="-1">متأكد إنك عايز تسلّم؟</h2>
    <div class="warn">${missing.length?'لسه في '+missing.length+' سؤال من غير إجابة، وهيتحسبوا غلط.':'كل الأسئلة متجاوب عليها.'} بعد التسليم مش هتقدر تعدّل أي حاجة.</div>
    ${missing.length?`<p class="muted">الأسئلة الناقصة: ${missing.map(i=>i+1).join('، ')}</p>`:''}
    <div class="actions"><button class="btn btn-s" id="no">رجوع أراجع</button><button class="btn btn-p" id="yes">تأكيد التسليم النهائي</button></div>`;
  app.appendChild(card);
  card.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  card.querySelector('#confirm-title').focus({preventScroll:true});
  card.querySelector('#yes').onclick=()=>doSubmit(false);
  card.querySelector('#no').onclick=()=>{card.remove();if(missing.length)scrollQuestion(missing[0]);else app.querySelector('#submit').focus();};
}

async function doSubmit(auto){
  const s = studentState;
  if(s.submitting)return;
  s.submitting=true;
  clearInterval(s.timerIv);
  app.querySelectorAll('button,input,textarea').forEach(el=>el.disabled=true);
  const saved=await flushAnswers();
  if(!saved){
    s.submitting=false;
    app.querySelectorAll('button,input,textarea').forEach(el=>el.disabled=false);
    app.querySelector('#confirm')?.remove();
    saveStatus('التسليم متوقف لأن في إجابات متحفظتش. اتأكد من النت واضغط التسليم تاني.');
    if(auto){
      render('<div class="card"><div class="err" role="alert">الوقت خلص، لكن في إجابات متحفظتش بسبب مشكلة في الاتصال. الامتحان لسه متسلّمش. اتأكد من النت واضغط إعادة المحاولة.</div><button class="btn btn-p" id="retry-save">إعادة الحفظ والتسليم</button></div>');
      on('#retry-save','click',()=>doSubmit(true));
    }else{
      const notice=document.createElement('div');notice.className='err';notice.setAttribute('role','alert');
      notice.textContent='في إجابات متحفظتش. اتأكد من النت واضغط التسليم تاني.';
      app.querySelector('.exam-finish').appendChild(notice);
      startTick();
    }
    return;
  }
  const timeSec = Math.min(s.exam.duration_min*60, Math.round((Date.now() - (s.endAt - s.exam.duration_min*60000))/1000));
  const { data, error } = await sb.rpc('submit_exam', { p_session: s.sessionId, p_time_sec: timeSec, p_auto: auto });
  if (error || !data || !data.ok){
    s.submitting=false;
    if (data && data.error === 'already_submitted'){ location.hash = '#/done'; studentDone({already:true}); return; }
    render('<div class="card"><div class="err">حصلت مشكلة في التسليم. جرب تاني.</div><div class="actions"><button class="btn btn-p" id="r">إعادة المحاولة</button></div></div>');
    on('#r','click', () => doSubmit(auto)); return;
  }
  studentState.result = data;
  location.hash = '#/done';
  studentDone();
}

let draft = null; // builder state
function blankQ(){ return { text:'', type:'mcq', choices:['',''], correct:-1, acceptedText:'', points:1 }; }

// Bulk import only changes the in-memory draft. Saving remains an explicit step.
function parseExamImport(raw){
  if(typeof raw !== 'string' || raw.length > 500000) throw new Error('الملف كبير جدًا. الحد الأقصى ٥٠٠ كيلوبايت.');
  let data; try { data=JSON.parse(raw); } catch { throw new Error('الملف مش JSON صالح. اختار ملف الامتحان الأصلي.'); }
  const rows=Array.isArray(data)?data:data?.questions;
  if(!Array.isArray(rows)||!rows.length||rows.length>100) throw new Error('لازم الملف يحتوي من ١ إلى ١٠٠ سؤال.');
  const questions=rows.map((q,i)=>{
    if(!q||typeof q.text!=='string'||!q.text.trim()||q.text.length>5000) throw new Error('نص السؤال '+(i+1)+' ناقص أو طويل جدًا.');
    if(q.type && q.type!=='mcq') throw new Error('الاستيراد بيدعم الاختيار من متعدد بس.');
    if(!Array.isArray(q.choices)||q.choices.length<2||q.choices.length>6||q.choices.some(c=>typeof c!=='string'||!c.trim()||c.length>2000)) throw new Error('راجع اختيارات السؤال '+(i+1)+'.');
    if(!Number.isInteger(q.correct)||q.correct<0||q.correct>=q.choices.length) throw new Error('الإجابة الصحيحة للسؤال '+(i+1)+' مش محددة صح.');
    if(q.points!==undefined && ![1,2,3,5,10].includes(q.points)) throw new Error('درجة السؤال '+(i+1)+' غير مدعومة.');
    return {text:q.text.trim(),type:'mcq',choices:q.choices.map(c=>c.trim()),correct:q.correct,points:q.points??1,acceptedText:''};
  });
  return {questions,title:typeof data.title==='string'?data.title.slice(0,200):'',subject:typeof data.subject==='string'?data.subject.slice(0,100):''};
}

      <label>متاح من (اختياري)</label><input type="datetime-local" id="f-start" value="${esc(d.startAt)}">

    </div>
    <div class="card" id="bulk-import">
      <div class="h2">استيراد أسئلة من ملف</div>
      <p class="muted">اختار ملف JSON اللي جهزتهولك، أو الصق محتواه. الأسئلة هتتضاف للمسودة بس، ومش هتتحفظ ولا تتنشر إلا لما تضغط حفظ بنفسك. الملف فيه الإجابات الصحيحة، احتفظ بيه للمدرس بس.</p>
      <label for="import-file">ملف الأسئلة (JSON)</label><input id="import-file" type="file" accept=".json,application/json">
      <details><summary style="cursor:pointer;min-height:44px;padding-top:12px">أو الصق محتوى الملف</summary>
        <textarea id="import-json" dir="ltr" rows="5" placeholder='{"questions":[{"text":"سؤال","choices":["أ","ب"],"correct":0}]}'></textarea>
        <button type="button" class="btn btn-s" id="import-paste">أضف الأسئلة للمسودة</button>

    </div></div>`);
  const syncDraft = () => {
    d.title = val('#f-title'); d.subject = val('#f-subject'); d.grade = val('#f-grade'); d.description = val('#f-desc');
    d.durationMin = +val('#f-dur')||15; d.passPct = +val('#f-pass')||50;
    d.startAt = val('#f-start'); d.endAt = val('#f-end');
    d.shuffleQ = val('#f-shq')==='1'; d.shuffleC = val('#f-shc')==='1'; d.showResult = val('#f-show')==='1';
    d.qs.forEach((q,i)=>{
      const t = app.querySelector(`[data-qtext="${i}"]`); if (t) q.text = t.value;
      const ty = app.querySelector(`[data-qtype="${i}"]`); if (ty) q.type = ty.value;
      const acc = app.querySelector(`[data-qacc="${i}"]`); if (acc) q.acceptedText = acc.value;
      const tf = app.querySelector(`[data-qtf="${i}"]`); if (tf) q.correct = +tf.value;
      const pts = app.querySelector(`[data-qpoints="${i}"]`); if (pts) q.points = +pts.value;
      q.choices = q.choices.map((c,ci)=>{ const el = app.querySelector(`[data-qchoice="${i}:${ci}"]`); return el ? el.value : c; });
      const rc = app.querySelector(`[data-qcorrect="${i}"]:checked`); if (rc) q.correct = +rc.value;
    });
  };
  const applyImport = async raw => {
    try {
      const imported=parseExamImport(raw);
      syncDraft();
      if(d.qs.length+imported.questions.length>100) throw new Error('الحد الأقصى للمسودة ١٠٠ سؤال.');
      d.qs.push(...imported.questions);
      if(!d.title.trim()) d.title=imported.title;
      if(!d.subject.trim()) d.subject=imported.subject;

    try {await applyImport(await file.text());} catch {app.querySelector('#import-status').innerHTML='<div class="err">مقدرتش أقرأ الملف. جرّب تاني أو الصق محتواه.</div>';}
    e.target.value='';
  });
  on('[data-qcorrect]','change', () => { app.querySelector('#berr').innerHTML=''; });

  on('[data-qtype]','change', () => { syncDraft(); tBuilderKeep(); });
  on('[data-qchoiceadd]','click', e => { syncDraft(); d.qs[+e.target.dataset.qchoiceadd].choices.push(''); tBuilderKeep(); });
  on('[data-qchoicedel]','click', e => { syncDraft(); const [i,ci] = e.target.dataset.qchoicedel.split(':').map(Number);
    const q = d.qs[i]; q.choices.splice(ci,1); if(q.correct===ci) q.correct=-1; else if(q.correct>ci) q.correct--; tBuilderKeep(); });
  on('[data-qup]','click', e => { syncDraft(); const i=+e.target.dataset.qup; if(i>0){[d.qs[i-1],d.qs[i]]=[d.qs[i],d.qs[i-1]];} tBuilderKeep(); });
  on('[data-qdown]','click', e => { syncDraft(); const i=+e.target.dataset.qdown; if(i<d.qs.length-1){[d.qs[i+1],d.qs[i]]=[d.qs[i],d.qs[i+1]];} tBuilderKeep(); });
  on('[data-qdel]','click', e => { syncDraft(); d.qs.splice(+e.target.dataset.qdel,1); tBuilderKeep(); });
  on('#save','click', async () => {
    syncDraft();
    const err = validateDraft(d);
    if (err){ app.querySelector('#berr').innerHTML = `<div class="err">${esc(err)}</div>`; return; }
    const examRow = { teacher_id: u.id, title: d.title.trim(), subject: d.subject.trim(), grade: d.grade.trim(), description: d.description.trim(),
      duration_min: d.durationMin, pass_pct: d.passPct,
      start_at: d.startAt ? new Date(d.startAt).toISOString() : null, end_at: d.endAt ? new Date(d.endAt).toISOString() : null,
      shuffle_q: d.shuffleQ, shuffle_c: d.shuffleC, show_result: d.showResult };
    let examId = d.id;
    if (examId){
      const { error } = await sb.from('exams').update(examRow).eq('id', examId);
      if (error){ app.querySelector('#berr').innerHTML = `<div class="err">${esc(error.message)}</div>`; return; }
      await sb.from('questions').delete().eq('exam_id', examId);
    } else {
      const { data: ins, error } = await sb.from('exams').insert(examRow).select('id').single();
      if (error){ app.querySelector('#berr').innerHTML = `<div class="err">${esc(error.message)}</div>`; return; }
      examId = ins.id;
    }
    const qRows = d.qs.map((q,i)=>({ exam_id: examId, ord: i, text: q.text.trim(), type: q.type,
      choices: q.type==='tf' ? ['صح','خطأ'] : (q.type==='mcq' ? q.choices.map(c=>c.trim()) : null),
      correct: (q.type==='mcq'||q.type==='tf') ? q.correct : null,
      accepted: q.type==='sa' ? q.acceptedText.split('\n').map(s=>s.trim()).filter(Boolean) : null,
      points: q.points }));
    const { error: qe } = await sb.from('questions').insert(qRows);
    if (qe){ app.querySelector('#berr').innerHTML = `<div class="err">${esc(qe.message)}</div>`; return; }
    draft = null;
    location.hash = '#/teacher/codes/' + examId;
  });
  function tBuilderKeep(){ location.hash = editId ? '#/teacher/edit/'+editId : '#/teacher/new'; renderBuilderAgain(); }
  function renderBuilderAgain(){ tBuilder(editId); }
}

function validateDraft(d){
  if (!d.title.trim()) return 'اكتب اسم الامتحان الأول.';
  if (!d.qs.length) return 'أضف سؤال واحد على الأقل.';
  for (let i=0;i<d.qs.length;i++){
    const q = d.qs[i];
    if (!q.text.trim()) return 'سؤال '+(i+1)+' من غير نص.';
    if (q.type==='mcq'){
      if (q.choices.filter(c=>c.trim()).length<2) return 'سؤال '+(i+1)+' محتاج اختيارين على الأقل.';
      if (!(q.choices[q.correct]||'').trim()) return 'حدد الإجابة الصحيحة لسؤال '+(i+1)+'.';
    }
    if (q.type==='sa' && !q.acceptedText.split('\n').map(s=>s.trim()).filter(Boolean).length) return 'سؤال '+(i+1)+' (إجابة قصيرة) محتاج إجابة مقبولة واحدة على الأقل.';
  }
  return '';
}

// Teacher tracking is read-only. All queries remain scoped by Supabase RLS.
const one = v => Array.isArray(v) ? v[0] : v;
const trackingDate = v => v ? new Date(v).toLocaleString('ar-EG', {dateStyle:'short',timeStyle:'short'}) : '—';
function trackingDuration(v){
  if (v == null || !Number.isFinite(Number(v))) return 'غير متاح';
  const sec = Math.max(0, Math.round(Number(v)));
  return `<bdi dir="ltr">${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}</bdi>`;
}
async function tTracking(examId){
  const u = await requireTeacher(); if (!u) return;
  teacherShell('#/teacher/tracking','<div class="h1">متابعة الطلبة</div><div class="note" role="status">بنحمّل المتابعة…</div>');
  const {data: exams, error: exError} = await sb.from('exams').select('id,title,duration_min').order('created_at',{ascending:false});
  if (exError) return trackingError();
  if (!exams?.length){
    teacherShell('#/teacher/tracking','<div class="h1">متابعة الطلبة</div><div class="note">مفيش امتحانات لسه. اعمل امتحان ووزّع أكواد الطلبة، ومتابعتهم هتظهر هنا.</div><a class="btn btn-p" href="#/teacher/new">امتحان جديد</a>'); return;
  }
  const exam = exams.find(e=>e.id===examId) || exams[0];
  const [codeRes, questionRes] = await Promise.all([
    sb.from('codes').select('id,student_name,status,via,exam_sessions(id,started_at,status,submissions(id,auto_score,auto_total,time_sec,submitted_at,essay_grades(question_id,awarded)))').eq('exam_id',exam.id).order('created_at'),
    sb.from('questions').select('id,points').eq('exam_id',exam.id).eq('type','essay')
  ]);
  if (codeRes.error || questionRes.error) return trackingError();
  if (!location.hash.startsWith('#/teacher/tracking')) return;
  const essays = questionRes.data || [], loadedAt = Date.now();
  const rows = (codeRes.data||[]).map(c=>{
    const session = one(c.exam_sessions), sub = one(session?.submissions);
    const status = sub || session?.status==='submitted' || c.status==='completed' ? 'submitted' : session || c.status==='in_progress' ? 'in_progress' : 'unused';
    const elapsed = session?.started_at ? Math.max(0,Math.floor((loadedAt-new Date(session.started_at).getTime())/1000)) : null;
    const overdue = status==='in_progress' && elapsed!==null && elapsed>=exam.duration_min*60;
    const grades = sub?.essay_grades||[];
    const pending = essays.some(q=>!grades.some(g=>g.question_id===q.id));
    const awarded = essays.reduce((sum,q)=>sum+Number(grades.find(g=>g.question_id===q.id)?.awarded||0),0);
    const total = sub ? Number(sub.auto_total)+essays.reduce((sum,q)=>sum+Number(q.points),0) : null;
    const score = sub ? Number(sub.auto_score)+awarded : null;
    return {...c,session,sub,status,elapsed,overdue,pending,total,score};
  });
  teacherShell('#/teacher/tracking',`
    <div class="h1">متابعة الطلبة</div>
    <p class="muted">مين دخل، ومين سلّم، ودرجته والوقت اللي خده.</p>
    <div class="card">
      <label for="track-exam">اختار الامتحان</label>
      <select id="track-exam">${exams.map(e=>`<option value="${esc(e.id)}" ${e.id===exam.id?'selected':''}>${esc(e.title)}</option>`).join('')}</select>
      <div class="actions"><button class="btn btn-p" id="track-refresh">تحديث المتابعة</button><a class="btn btn-s" href="#/teacher/codes/${exam.id}">أكواد الامتحان</a></div>
      <div class="muted" style="margin-top:8px">آخر تحديث: ${trackingDate(loadedAt)}. اضغط تحديث عشان تشوف آخر حالة.</div>
    </div>
    <div class="cards track-counts">
      <div class="scard"><b>${rows.length}</b><span>كل الطلبة</span></div>
      <div class="scard"><b>${rows.filter(r=>r.status==='unused').length}</b><span>لسه مدخلوش</span></div>
      <div class="scard"><b>${rows.filter(r=>r.status==='in_progress').length}</b><span>دخلوا ولم يسلّموا</span></div>
      <div class="scard"><b>${rows.filter(r=>r.status==='submitted').length}</b><span>سلّموا الامتحان</span></div>
    </div>
    <div class="card">
      <label for="track-search">دور باسم الطالب</label><input id="track-search" type="text" placeholder="اكتب اسم الطالب">
      <label for="track-status">الحالة</label><select id="track-status"><option value="all">كل الحالات</option value="unused">لسه مدخلش</option value="in_progress">دخل ولم يسلّم</option><option value="submitted">سلّم الامتحان</option></select>
    </div>
    <div id="track-list" aria-live="polite"></div>
    <div class="note">القائمة بتعرض كل محاولات الامتحان ده، سواء بكود أو باللينك المفتوح (عليها علامة «رابط مفتوح»). «دخل ولم يسلّم» معناها إنه بدأ جلسة، مش بالضرورة فاتح الصفحة دلوقتي. لو في أسئلة مقالية، الدرجة بتفضل مبدئية لحد تصحيحها.</div>
    <a class="btn btn-s" href="#/teacher/results">النتايج وتصحيح المقالي</a>`);
  const draw = () => {
    const query = normAr(val('#track-search')), status = val('#track-status');
    const filtered = rows.filter(r=>(status==='all'||r.status===status)&&normAr(r.student_name).includes(query));
    app.querySelector('#track-list').innerHTML = !rows.length ? '<div class="note">مفيش أكواد طلبة للامتحان ده لسه. اعمل كود لكل طالب من «أكواد الامتحان».</div>' : !filtered.length ? '<div class="note">مفيش طلبة مطابقين للبحث أو الحالة دي.</div>' : filtered.map(r=>`
      <article class="card track-student">
        <div class="track-head"><strong>${esc(r.student_name)}</strong>${r.via==='open'?'<span class="chip">رابط مفتوح</span>':''}<span class="chip ${r.status==='submitted'?'c-done':r.status==='in_progress'?'c-prog':'c-new'}">${r.status==='submitted'?'سلّم الامتحان':r.status==='in_progress'?'دخل ولم يسلّم':'لسه مدخلش'}</span></div>
        <div class="track-metrics">
          <div><span>الدرجة</span><b>${r.sub?`${r.score} من ${r.total}`:'—'}</b><small>${r.sub?(r.pending?'مبدئية · المقالي مستني التصحيح':`نهائية${r.total?' · '+Math.round(r.score*1000/r.total)/10+'%':''}`):r.status==='submitted'?'النتيجة غير متاحة':'بعد التسليم'}</small></div>
          <div><span>${r.status==='in_progress'?'الوقت من الدخول':'مدة الحل'}</span><b>${r.sub?trackingDuration(r.sub.time_sec):r.status==='in_progress'?trackingDuration(r.elapsed):'—'}</b><small>${r.status==='in_progress'?'حتى آخر تحديث':r.sub?'دقيقة : ثانية':'لسه مبدأش'}</small></div>
        </div>
        ${r.session?`<div class="muted">دخل: ${trackingDate(r.session.started_at)}</div>`:''}
        ${r.sub?`<div class="muted">سلّم: ${trackingDate(r.sub.submitted_at)}</div>`:''}
        ${r.overdue?'<div class="warn">مدة الامتحان عدّت، لكن مفيش تسليم مسجّل لسه.</div>':''}
      </article>`).join('');
  };
  on('#track-search','input',draw); on('#track-status','change',draw);
  on('#track-exam','change',()=>{location.hash='#/teacher/tracking/'+val('#track-exam');});
  on('#track-refresh','click',()=>tTracking(exam.id)); draw();
  function trackingError(){
    if (!location.hash.startsWith('#/teacher/tracking')) return;
    teacherShell('#/teacher/tracking','<div class="h1">متابعة الطلبة</div><div class="err">مش قادرين نحمّل المتابعة دلوقتي. مفيش بيانات اتغيرت. جرّب تاني.</div><button class="btn btn-p" id="track-retry">حاول تاني</button>');
    on('#track-retry','click',()=>tTracking(examId));
  }
}

async function loadSubmissions(){
  const { data: subs } = await sb.from('submissions').select('*, exam_sessions(code_id, codes(token, student_name, parent_phone, via, exam_id, exams(id,title,subject,grade,pass_pct)))').order('submitted_at',{ascending:false});
  return subs || [];
}
function flatSub(s){
  const c = s.exam_sessions?.codes || {};
  return { id: s.id, session_id: s.session_id, student: c.student_name||'—', token: c.token||'', phone: c.parent_phone||'', via: c.via||'code', examId: c.exams?.id||null,
    title: c.exams?.title||'امتحان محذوف', subject: c.exams?.subject||'', grade: c.exams?.grade||'', passPct: c.exams?.pass_pct||50,
    autoScore: s.auto_score, autoTotal: s.auto_total, cc: s.correct_count, nAuto: s.n_auto, bitmap: s.bitmap,
    timeSec: s.time_sec, at: s.submitted_at };
}

async function tResults(){
  const u = await requireTeacher(); if (!u) return;
  const subs = (await loadSubmissions()).map(flatSub);
  const { data: grades } = await sb.from('essay_grades').select('*');
  const gmap = {}; (grades||[]).forEach(g => { (gmap[g.submission_id] = gmap[g.submission_id] || {})[g.question_id] = g.awarded; });
  const finalOf = async s => s; // final computed below with essay max fetched lazily
  teacherShell('#/teacher/results', `
    <div class="h1">النتايج</div><a class="btn btn-t" href="#/teacher/tracking">متابعة دخول الطلبة ومدة الحل</a>
    ${subs.length ? `<div class="card">${subs.map((s,i)=>`
      <div class="row"><div>
        <div class="nm">${esc(s.student)}</div>
        <div class="dt">${esc(s.title)} · تلقائي: ${s.autoScore}/${s.autoTotal} · صح ${s.cc} من ${s.nAuto} · ${Math.round(s.timeSec/60)} دقيقة · ${new Date(s.at).toLocaleDateString('ar-EG')}</div>
        <div class="dt" id="final-${s.id}">…</div>
      </div><div class="actions" style="margin:0">
        <button class="btn btn-s btn-sm" data-essays="${s.id}" data-exam="${s.examId}" data-session="${s.session_id}">المقالي</button>
        <button class="btn btn-g btn-sm" data-rdel="${s.id}">حذف</button>
      </div></div>`).join('')}</div>` : '<div class="note">مفيش نتايج لسه. أول ما الطلبة يسلّموا هتظهر هنا تلقائي - مفيش استيراد يدوي في النسخة دي.</div>'}
    <div id="essaybox"></div>`);
  // compute finals
  for (const s of subs){
    const { data: eqs } = await sb.from('questions').select('id,type,points,text').eq('exam_id', s.examId);
    const essays = (eqs||[]).filter(q=>q.type==='essay');
    const max = essays.reduce((a,q)=>a+Number(q.points),0);
    const awarded = Object.values(gmap[s.id]||{}).reduce((a,b)=>a+Number(b),0);
    const pending = essays.length && essays.some(q => gmap[s.id]?.[q.id] === undefined);
    const score = s.autoScore + awarded, total = s.autoTotal + max;
    const el = app.querySelector('#final-'+s.id);
    if (el) el.innerHTML = `النهائي: <b>${score}/${total}</b> (${total?Math.round(score*1000/total)/10:0}%) ${pending?'<span class="chip c-new">مبدئي - في مقالي مستني</span>':'<span class="chip c-done">نهائي</span>'}`;
  }
  on('[data-essays]','click', async e => {
    const box = app.querySelector('#essaybox');
    const { data: eqs } = await sb.from('questions').select('id,text,points').eq('exam_id', e.target.dataset.exam).eq('type','essay').order('ord');
    if (!eqs || !eqs.length){ box.innerHTML = '<div class="note">الامتحان ده مفيهوش أسئلة مقالية.</div>'; return; }
    const subId = e.target.dataset.essays, sessionId = e.target.dataset.session;
    const { data: ans } = await sb.from('answers').select('*').eq('session_id', sessionId);
    const amap = {}; (ans||[]).forEach(a => amap[a.question_id] = a.answer);
    const { data: gr } = await sb.from('essay_grades').select('*').eq('submission_id', subId);
    const gm = {}; (gr||[]).forEach(g => gm[g.question_id] = g.awarded);
    box.innerHTML = `<div class="card"><div class="h2">تصحيح المقالي</div>
      ${eqs.map(q=>`<div class="card" style="background:var(--gray)">
        <div class="nm">${esc(q.text)} (من ${q.points})</div>
        <div class="msg">${esc(amap[q.id] ?? '(الطالب مكتبش إجابة)')}</div>
        <label>الدرجة</label><input type="number" min="0" max="${q.points}" step="0.5" data-award="${q.id}" data-max="${q.points}" value="${gm[q.id] ?? ''}" style="max-width:120px">
      </div>`).join('')}
      <div class="actions"><button class="btn btn-p" id="save-grades">احفظ التصحيح</button></div><div id="gerr"></div></div>`;
    box.scrollIntoView({behavior:'smooth'});
    on('#save-grades','click', async () => {
      const rows = [];
      app.querySelectorAll('[data-award]').forEach(inp => {
        if (inp.value === '') return;
        const v = Math.max(0, Math.min(+inp.dataset.max, +inp.value || 0));
        rows.push({ submission_id: subId, question_id: inp.dataset.award, awarded: v });
      });
      for (const r of rows) await sb.from('essay_grades').upsert(r);
      tResults();
    });
  });
  on('[data-rdel]','click', async e => {
    if (e.target.dataset.confirm){ await sb.from('submissions').delete().eq('id', e.target.dataset.rdel); tResults(); }
    else { e.target.dataset.confirm='1'; e.target.textContent='متأكد؟ اضغط للحذف'; }
  });
}

async function tAnalytics(examId){
  const u = await requireTeacher(); if (!u) return;
  const { data: exams } = await sb.from('exams').select('id,title,pass_pct').order('created_at',{ascending:false});
  const subs = (await loadSubmissions()).map(flatSub);
  const withRes = (exams||[]).filter(e => subs.some(s=>s.examId===e.id));
  if (!withRes.length){ teacherShell('#/teacher/analytics','<div class="h1">التحليلات</div><div class="note">مفيش بيانات لسه، أول ما تيجي نتايج هتظهر هنا.</div>'); return; }
  const exam = withRes.find(e=>e.id===examId) || withRes[0];
  const rows = subs.filter(s=>s.examId===exam.id);
  const { data: eqs } = await sb.from('questions').select('id,text,type,points').eq('exam_id', exam.id).order('ord');
  const auto = (eqs||[]).filter(q=>q.type!=='essay');
  const { data: grades } = await sb.from('essay_grades').select('*');
  const gsum = {}; (grades||[]).forEach(g => gsum[g.submission_id]=(gsum[g.submission_id]||0)+Number(g.awarded));
  const essayMax = (eqs||[]).filter(q=>q.type==='essay').reduce((a,q)=>a+Number(q.points),0);
  const finalPct = s => { const t = s.autoTotal + essayMax; return t ? Math.round((s.autoScore + (gsum[s.id]||0))*1000/t)/10 : 0; };
  const pcts = rows.map(finalPct);
  const avg = Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length);
  const passRate = Math.round(pcts.filter(p=>p>=exam.pass_pct).length*100/pcts.length);
  const qStats = auto.map((q,i)=>{
    const att = rows.filter(r=>r.bitmap && r.bitmap.length>i);
    const ok = att.filter(r=>r.bitmap[i]==='1').length;
    return { ...q, pct: att.length ? Math.round(ok*100/att.length) : 0, n: att.length };
  });
  const ranked = rows.slice().sort((a,b)=>finalPct(b)-finalPct(a));
  const missed = qStats.slice().sort((a,b)=>a.pct-b.pct).slice(0,3);
  teacherShell('#/teacher/analytics', `
    <div class="h1">التحليلات</div>
    ${withRes.length>1?`<label>الامتحان</label><select id="a-exam">${withRes.map(e=>`<option value="${e.id}" ${e.id===exam.id?'selected':''}>${esc(e.title)}</option>`).join('')}</select>`:''}
    <div class="cards">
      <div class="scard"><b>${rows.length}</b><span>تسليم</span></div>
      <div class="scard"><b>${avg}%</b><span>المتوسط</span></div>
      <div class="scard"><b>${Math.max(...pcts)}%</b><span>أعلى درجة</span></div>
      <div class="scard"><b>${Math.min(...pcts)}%</b><span>أقل درجة</span></div>
      <div class="scard"><b>${passRate}%</b><span>نسبة النجاح</span></div>
    </div>
    <div class="card"><div class="h2">ترتيب الطلبة</div>
      ${ranked.map((s,i)=>`<div class="row"><div><span class="muted">${i+1}.</span> <span class="nm">${esc(s.student)}</span></div><div class="vl">${finalPct(s)}%</div></div>`).join('')}
    </div>
    <div class="card"><div class="h2">صعوبة الأسئلة (نسبة الصح)</div>
      ${qStats.map((q,i)=>`<div class="bar"><i style="width:${q.pct}%"></i><span>س${i+1}: ${esc(q.text.length>50?q.text.slice(0,49)+'…':q.text)}</span><em>${q.pct}% · ${q.n} محاولة</em></div>`).join('')}
    </div>
    <div class="card"><div class="h2">أكتر الأسئلة اللي الطلبة غلطوا فيها</div>
      ${missed.map(q=>`<div class="row"><div class="nm">${esc(q.text.length>70?q.text.slice(0,69)+'…':q.text)}</div><div class="vl">${q.pct}% صح</div></div>`).join('') || '<div class="note">مفيش بيانات كفاية.</div>'}
    </div>`);
  on('#a-exam','change', () => { location.hash = '#/teacher/analytics/' + val('#a-exam'); });
}

async function tReports(){
  const u = await requireTeacher(); if (!u) return;
  const p = await getProfile(u.id);
  const subs = (await loadSubmissions()).map(flatSub);
  if (!subs.length){ teacherShell('#/teacher/reports','<div class="h1">تقارير أولياء الأمور</div><div class="note">مفيش نتايج لسه.</div>'); return; }
  const { data: st } = await sb.from('students').select('name,parent_phone');
  const phoneFor = (n, subPhone) => (st||[]).find(s=>s.name===n)?.parent_phone || subPhone || '';
  const { data: grades } = await sb.from('essay_grades').select('*');
  const gmap = {}; (grades||[]).forEach(g => { (gmap[g.submission_id]=gmap[g.submission_id]||{})[g.question_id]=Number(g.awarded); });
  const reports = [];
  for (const s of subs){
    const { data: eqs } = await sb.from('questions').select('id,text,type,points').eq('exam_id', s.examId).order('ord');
    const essays = (eqs||[]).filter(q=>q.type==='essay');
    const essayMax = essays.reduce((a,q)=>a+Number(q.points),0);
    const awarded = Object.values(gmap[s.id]||{}).reduce((a,b)=>a+b,0);
    const pending = essays.length && essays.some(q=>gmap[s.id]?.[q.id]===undefined);
    const score = s.autoScore + awarded, total = s.autoTotal + essayMax;
    const pct = total ? Math.round(score*1000/total)/10 : 0;
    const wrong = [];
    (eqs||[]).filter(q=>q.type!=='essay').forEach((q,i)=>{ if (s.bitmap && s.bitmap[i]==='0') wrong.push(q.text); });
    const level = pct>=85?'ممتاز':pct>=75?'جيد جدًا':pct>=65?'جيد':pct>=50?'مقبول':'ضعيف - يحتاج دعم';
    const report = ['تقرير أداء الطالب: '+s.student,
      'الامتحان: '+s.title+(s.subject?' ('+s.subject+')':''),
      s.grade?'الصف: '+s.grade:'',
      'التاريخ: '+new Date(s.at).toLocaleDateString('ar-EG')+' - الوقت المستغرق: '+Math.round(s.timeSec/60)+' دقيقة',
      'الدرجة: '+score+' من '+total+' ('+pct+'%)'+(pending?' - مبدئية، في انتظار تصحيح المقالي':''),
      'التقدير: '+level+(pct>=s.passPct?' - ناجح':' - لم يصل لدرجة النجاح ('+s.passPct+'%)'),
      'إجابات صحيحة: '+s.cc+' - خاطئة أو بدون إجابة: '+(s.nAuto-s.cc),
      wrong.length?'محتاج يراجع: '+wrong.slice(0,3).join(' | '):'مفيش نقاط ضعف واضحة في الأسئلة الموضوعية.',
    ].filter(Boolean).join('\n');
    reports.push({ s, report, pct, pending });
  }
  teacherShell('#/teacher/reports', `
    <div class="h1">تقارير أولياء الأمور</div>
    <div class="note">راجع التقرير واضغط "إرسال واتساب" - هيتفتح واتساب بالتقرير جاهز لولي الأمر. "طباعة / PDF" بيفتح نسخة للطباعة تقدر تحفظها PDF من المتصفح.</div><div class="warn">الإرسال الأوتوماتيك الكامل لتقارير أولياء الأمور: <b>غير متاح حاليًا</b>. لحد ما تتأكد قناة الإرسال والمستلم الصح وإذن الكشف، الإرسال يدوي بضغطة منك بعد مراجعة كل تقرير.</div>
    ${reports.map((r,i)=>`<div class="card">
      <div class="nm">${esc(r.s.student)} ${r.pending?'<span class="chip c-new">مبدئي</span>':'<span class="chip c-done">نهائي</span>'} <span class="muted">${esc(r.s.title)} · ${r.pct}%</span></div>
      <div class="msg" id="rep-${i}" style="display:none;margin-top:8px">${esc(r.report)}</div>
      <label>رقم واتساب ولي الأمر</label>
      <input type="text" id="ph-${i}" value="${esc(phoneFor(r.s.student, r.s.phone))}">
      <div class="actions">
        <button class="btn btn-s btn-sm" data-show="${i}">عرض / إخفاء التقرير</button>
        <a class="btn btn-p btn-sm" target="_blank" rel="noopener" href="${waLink(phoneFor(r.s.student, r.s.phone), r.report)}" id="wa-${i}">إرسال واتساب</a>
        <button class="btn btn-s btn-sm" data-print="${i}">طباعة / PDF</button>
      </div>
    </div>`).join('')}`);
  on('[data-show]','click', e => { const el = app.querySelector('#rep-'+e.target.dataset.show); el.style.display = el.style.display==='none'?'block':'none'; });
  on('[data-print]','click', e => {
    const i = +e.target.dataset.print;
    const w = window.open('', '_blank');
    w.document.write(`<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>تقرير</title><style>body{font-family:Tahoma;line-height:2;padding:30px;white-space:pre-wrap}.track-counts{grid-template-columns:repeat(2,minmax(0,1fr))}.track-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.track-head strong{font-size:18px;overflow-wrap:anywhere}.track-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.track-metrics>div{background:var(--gray);border-radius:12px;padding:12px;min-width:0}.track-metrics span,.track-metrics small{display:block;font-size:12px;color:var(--ink2)}.track-metrics b{display:block;font-size:22px;color:var(--navy)}
</style></head><body>${esc(reports[i].report)}</body></html>`);
    w.document.close(); w.focus(); w.print();
  });
  // keep wa link in sync with edited phone
  reports.forEach((r,i)=>{
    const inp = app.querySelector('#ph-'+i);
    if (inp) inp.addEventListener('input', () => { app.querySelector('#wa-'+i).href = waLink(inp.value, r.report); });
  });
}

async function tSettings(){
  const u = await requireTeacher(); if (!u) return;
  const p = await getProfile(u.id);
  teacherShell('#/teacher/settings', `
    <div class="h1">الإعدادات</div>
    <div class="card">
      <label>اسمك (بيظهر للطلبة وأولياء الأمور)</label><input type="text" id="p-name" value="${esc(p.display_name||'')}">
      <label>رقم الواتساب بتاعك</label><input type="text" id="p-phone" value="${esc(p.phone||'')}">
      <label>نسبة النجاح الافتراضية %</label><input type="number" id="p-pass" value="${p.default_pass_pct||50}">
      <label>المدة الافتراضية بالدقائق</label><input type="number" id="p-dur" value="${p.default_duration||15}">
      <div class="actions"><button class="btn btn-p" id="p-save">احفظ</button></div>
      <div id="p-ok"></div>
    </div>`);
  on('#p-save','click', async () => {
    const row = { id: u.id, display_name: val('#p-name').trim(), phone: val('#p-phone').trim(),
      default_pass_pct: +val('#p-pass')||50, default_duration: +val('#p-dur')||15 };
    await sb.from('profiles').upsert(row);
    profileCache = row;
    app.querySelector('#p-ok').innerHTML = '<div class="note">اتحفظت.</div>';
  });
}

// ============ ROUTER ============
async function route(){
  const h = location.hash || '#/';
  const openTok = new URLSearchParams(location.search).get('open');
  if (openTok && !studentState) return openLanding(openTok);
  document.body.classList.toggle('student-view',!h.startsWith('#/teacher'));
  clearInterval(studentState?.timerIv);
  if (h === '#/' || h === '#') return studentLanding();
  if (h === '#/exam') return studentState ? studentInfo() : studentLanding();
  if (h === '#/exam/q') return studentState ? studentExam() : studentLanding();
  if (h === '#/done') return studentState ? studentDone() : studentLanding();
  if (h === '#/teacher/login') return teacherLogin();
  if (h === '#/teacher') return tDashboard();
  if (h === '#/teacher/exams') return tExams();
  if (h === '#/teacher/new') return tBuilder(null);
  if (h.startsWith('#/teacher/edit/')) return tBuilder(h.split('/')[3]);
  if (h === '#/teacher/students') return tStudents();
  if (h.startsWith('#/teacher/codes')) return tCodes(h.split('/')[3]);
  if (h.startsWith('#/teacher/tracking')) return tTracking(h.split('/')[3]);
  if (h === '#/teacher/results') return tResults();
  if (h.startsWith('#/teacher/analytics')) return tAnalytics(h.split('/')[3]);
  if (h === '#/teacher/reports') return tReports();
  if (h === '#/teacher/settings') return tSettings();
  studentLanding();
}
window.addEventListener('hashchange', route);
if (SUPABASE_URL.startsWith('__')){
  render('<div class="card"><div class="err">المنصة لسه متظبطتش: لازم تتحط قيم Supabase (SUPABASE_URL و SUPABASE_ANON_KEY) في أول ملف index.html. الخطوات في README.</div></div>');
} else {
  route();
}
</script>

window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
